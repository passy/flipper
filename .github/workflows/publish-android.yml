name: Publish Android
# This action runs on 'git push tag v*' and worflow dispatch as specified below
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload artifacts to"
        required: false

jobs:
  build:
    if: ${{ (github.repository == 'facebook/flipper' || github.repository == 'passy/flipper') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3.5.3
    - name: set up JDK
      uses: actions/setup-java@v3.11.0
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Write GPG Sec Ring
      run: |
        export GNUPGHOME="$(mktemp -d)"
        gpg --batch --pinentry-mode loopback --passphrase rehearsal-fake-passphrase --quick-gen-key "Flipper Rehearsal <rehearsal@invalid>" rsa3072 sign never
        gpg --batch --pinentry-mode loopback --passphrase rehearsal-fake-passphrase --export-secret-keys > /tmp/secring.gpg
        echo "REHEARSAL_SIGNING_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print substr($5,9); exit}')" >> "$GITHUB_ENV"
    - name: Update gradle.properties
      run: echo -e "signing.secretKeyRingFile=/tmp/secring.gpg\nsigning.keyId=${{ env.REHEARSAL_SIGNING_KEY_ID }}\nsigning.password=rehearsal-fake-passphrase\nmavenCentralPassword=rehearsal-fake-password\nmavenCentralUsername=rehearsal-fake-username\nSONATYPE_HOST=CENTRAL_PORTAL\nRELEASE_SIGNING_ENABLED=true\nSONATYPE_AUTOMATIC_RELEASE=true" >> gradle.properties
    - name: Compute build cache
      run: ./scripts/checksum-android.sh checksum-android.txt
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/build-cache-*
        key: gradle-${{ hashFiles('checksum-android.txt') }}
    - name: Build artifacts
      run: ./gradlew :sample:assembleDebug :sample:assembleRelease && ./gradlew :android:assembleRelease
    - name: Upload Archives
      run: ./gradlew publish -info
    - name: Clean secrets
      if: always()
      run: rm /tmp/secring.gpg
    - name: Rename apk
      run: mv android/sample/build/outputs/apk/debug/sample-debug.apk SampleApp-android.apk
    - name: Attach sample APK to release
      if: ${{ github.event.inputs.tag != '' }}
      uses: softprops/action-gh-release@v0.1.15
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.tag }}
        fail_on_unmatched_files: true
        files: SampleApp-android.apk
    - name: Open issue on failure
      if: failure()
      uses: JasonEtco/create-an-issue@v2.4.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: "Publish Android"
      with:
        filename: .github/action-failure-template.md
